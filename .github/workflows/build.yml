          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/Cue.kt')"
          cat > 'app/src/main/java/com/example/legendasth/Cue.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.content.Context
          import java.io.File
          import java.util.Locale

          /** Uma legenda: tempos em milissegundos, texto original (tailandês) e tradução (inglês). */
          data class Cue(val startMs: Long, val endMs: Long, val th: String, val en: String)

          object Subtitles {
              private const val LINE_CHARS = 42

              fun clock(ms: Long): String {
                  val total = ms / 1000
                  return String.format(Locale.US, "%02d:%02d", total / 60, total % 60)
              }

              /** O Whisper às vezes inventa texto repetido em trechos sem fala clara. Descarta esses casos. */
              fun looksLikeHallucination(text: String): Boolean {
                  val t = text.filter { !it.isWhitespace() }
                  if (t.isEmpty()) return true
                  if (t.none { it.isLetterOrDigit() }) return true
                  if (t.length >= 8 && t.toSet().size <= 2) return true
                  return isRepeated(t)
              }

              private fun isRepeated(s: String): Boolean {
                  if (s.length < 10) return false
                  for (unit in 1..15) {
                      if (unit * 4 > s.length) break
                      val u = s.substring(0, unit)
                      var count = 0
                      var i = 0
                      while (i + unit <= s.length && s.startsWith(u, i)) {
                          count++
                          i += unit
                      }
                      if (count >= 4 && count * unit >= s.length * 0.8) return true
                  }
                  return false
              }

              /** Quebra o texto em legendas de até 2 linhas de 42 caracteres. */
              fun splitEnglish(text: String): List<String> {
                  val words = text.trim().split(Regex("\\s+")).filter { it.isNotEmpty() }
                  if (words.isEmpty()) return listOf("")
                  val lines = ArrayList<String>()
                  var cur = StringBuilder()
                  for (w in words) {
                      if (cur.isNotEmpty() && cur.length + 1 + w.length > LINE_CHARS) {
                          lines.add(cur.toString())
                          cur = StringBuilder()
                      }
                      if (cur.isNotEmpty()) cur.append(' ')
                      cur.append(w)
                  }
                  if (cur.isNotEmpty()) lines.add(cur.toString())
                  val result = ArrayList<String>()
                  var i = 0
                  while (i < lines.size) {
                      result.add(if (i + 1 < lines.size) lines[i] + "\n" + lines[i + 1] else lines[i])
                      i += 2
                  }
                  return result
              }

              /** Divide legendas longas em várias, repartindo o tempo pelo tamanho do texto. */
              fun expand(cues: List<Cue>): List<Cue> {
                  val out = ArrayList<Cue>()
                  for (c in cues) {
                      val parts = splitEnglish(c.en)
                      if (parts.size <= 1) {
                          out.add(c)
                          continue
                      }
                      val total = parts.sumOf { it.length }.coerceAtLeast(1)
                      val dur = (c.endMs - c.startMs).coerceAtLeast(1L)
                      var acc = 0
                      var cursor = c.startMs
                      for ((i, p) in parts.withIndex()) {
                          acc += p.length
                          val end = if (i == parts.lastIndex) c.endMs else c.startMs + dur * acc / total
                          out.add(Cue(cursor, end, c.th, p))
                          cursor = end
                      }
                  }
                  return out
              }

              private fun stamp(ms: Long): String {
                  val h = ms / 3_600_000
                  val m = ms / 60_000 % 60
                  val s = ms / 1000 % 60
                  val milli = ms % 1000
                  return String.format(Locale.US, "%02d:%02d:%02d,%03d", h, m, s, milli)
              }

              fun toSrt(cues: List<Cue>, pick: (Cue) -> String): String {
                  val sb = StringBuilder()
                  var n = 1
                  for (c in cues) {
                      val text = pick(c).trim()
                      if (text.isEmpty()) continue
                      sb.append(n++).append('\n')
                      sb.append(stamp(c.startMs)).append(" --> ").append(stamp(maxOf(c.endMs, c.startMs + 500))).append('\n')
                      sb.append(text).append("\n\n")
                  }
                  return sb.toString()
              }
          }

          /** Guarda as legendas da última análise (uma por linha, enquanto são geradas). */
          object CueStore {
              private const val FILE = "last_cues.tsv"

              class Saved(val videoUri: String, val videoName: String, val cues: List<Cue>)

              private fun clean(s: String) = s.replace('\t', ' ').replace('\n', ' ').replace('\r', ' ')

              fun begin(context: Context, videoUri: String, videoName: String) {
                  File(context.filesDir, FILE).writeText("#" + clean(videoUri) + "\t" + clean(videoName) + "\n")
              }

              fun append(context: Context, cue: Cue) {
                  File(context.filesDir, FILE).appendText(
                      "${cue.startMs}\t${cue.endMs}\t${clean(cue.th)}\t${clean(cue.en)}\n"
                  )
              }

              fun exists(context: Context): Boolean {
                  val f = File(context.filesDir, FILE)
                  return f.exists() && f.length() > 0
              }

              fun load(context: Context): Saved? {
                  val f = File(context.filesDir, FILE)
                  if (!f.exists()) return null
                  val lines = f.readLines()
                  if (lines.isEmpty() || !lines[0].startsWith("#")) return null
                  val head = lines[0].substring(1).split('\t')
                  if (head.isEmpty()) return null
                  val cues = ArrayList<Cue>()
                  for (i in 1 until lines.size) {
                      val p = lines[i].split('\t', limit = 4)
                      if (p.size < 4) continue
                      val a = p[0].toLongOrNull() ?: continue
                      val b = p[1].toLongOrNull() ?: continue
                      cues.add(Cue(a, b, p[2], p[3]))
                  }
                  return Saved(head[0], if (head.size > 1) head[1] else "vídeo", cues)
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/AudioDecoder.kt')"
          cat > 'app/src/main/java/com/example/legendasth/AudioDecoder.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.content.Context
          import android.media.AudioFormat
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import java.nio.ByteOrder

          /**
           * Converte um fluxo de amostras mono para 16 kHz fazendo a média das amostras de entrada
           * que cabem em cada amostra de saída (um filtro simples que evita chiado ao reduzir a taxa).
           */
          class MonoResampler(inRate: Int, outRate: Int, private val sink: (FloatArray, Int) -> Unit) {
              private val ratio = inRate.toDouble() / outRate
              private var acc = 0.0
              private var filled = 0.0
              private val buf = FloatArray(16_000)
              private var n = 0

              fun push(x: Float) {
                  var w = 1.0
                  while (w > 1e-9) {
                      val need = ratio - filled
                      if (w < need - 1e-9) {
                          acc += x * w
                          filled += w
                          w = 0.0
                      } else {
                          acc += x * need
                          w -= need
                          buf[n++] = (acc / ratio).toFloat()
                          acc = 0.0
                          filled = 0.0
                          if (n == buf.size) flush()
                      }
                  }
              }

              fun flush() {
                  if (n > 0) {
                      sink(buf, n)
                      n = 0
                  }
              }
          }

          object AudioDecoder {
              const val OUT_RATE = 16_000

              class NoAudioException : Exception("Este vídeo não tem faixa de áudio.")

              /**
               * Decodifica o áudio do vídeo para 16 kHz mono e entrega em pedaços para [onSamples].
               * O array entregue é reaproveitado: quem receber deve copiar o que precisar guardar.
               */
              fun decode(
                  context: Context,
                  uri: Uri,
                  isCancelled: () -> Boolean,
                  onProgress: (Float) -> Unit,
                  onSamples: (FloatArray, Int) -> Unit
              ) {
                  val extractor = MediaExtractor()
                  var codec: MediaCodec? = null
                  try {
                      extractor.setDataSource(context, uri, null)

                      var trackIndex = -1
                      var found: MediaFormat? = null
                      for (i in 0 until extractor.trackCount) {
                          val f = extractor.getTrackFormat(i)
                          val mime = f.getString(MediaFormat.KEY_MIME) ?: continue
                          if (mime.startsWith("audio/")) {
                              trackIndex = i
                              found = f
                              break
                          }
                      }
                      val format: MediaFormat = found ?: throw NoAudioException()
                      extractor.selectTrack(trackIndex)

                      val mime = format.getString(MediaFormat.KEY_MIME) ?: throw NoAudioException()
                      val durationUs =
                          if (format.containsKey(MediaFormat.KEY_DURATION)) format.getLong(MediaFormat.KEY_DURATION) else 0L

                      val c = MediaCodec.createDecoderByType(mime)
                      codec = c
                      c.configure(format, null, null, 0)
                      c.start()

                      var sampleRate = format.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                      var channels = format.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                      var floatPcm = false
                      var resampler = MonoResampler(sampleRate, OUT_RATE, onSamples)

                      val info = MediaCodec.BufferInfo()
                      var inputDone = false
                      var outputDone = false

                      while (!outputDone) {
                          if (isCancelled()) break

                          if (!inputDone) {
                              val inIdx = c.dequeueInputBuffer(10_000)
                              if (inIdx >= 0) {
                                  val inBuf = c.getInputBuffer(inIdx)
                                  val size = if (inBuf != null) extractor.readSampleData(inBuf, 0) else -1
                                  if (size < 0) {
                                      c.queueInputBuffer(inIdx, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      inputDone = true
                                  } else {
                                      val t = extractor.sampleTime
                                      c.queueInputBuffer(inIdx, 0, size, t, 0)
                                      if (durationUs > 0 && t >= 0) {
                                          onProgress((t.toFloat() / durationUs).coerceIn(0f, 1f))
                                      }
                                      extractor.advance()
                                  }
                              }
                          }

                          val outIdx = c.dequeueOutputBuffer(info, 10_000)
                          if (outIdx >= 0) {
                              val out = c.getOutputBuffer(outIdx)
                              if (out != null && info.size > 0) {
                                  out.position(info.offset)
                                  out.limit(info.offset + info.size)
                                  out.order(ByteOrder.nativeOrder())
                                  if (floatPcm) {
                                      val fb = out.asFloatBuffer()
                                      val total = fb.remaining()
                                      var i = 0
                                      while (i + channels <= total) {
                                          var sum = 0f
                                          for (ch in 0 until channels) sum += fb.get(i + ch)
                                          resampler.push(sum / channels)
                                          i += channels
                                      }
                                  } else {
                                      val sb = out.asShortBuffer()
                                      val total = sb.remaining()
                                      var i = 0
                                      while (i + channels <= total) {
                                          var sum = 0
                                          for (ch in 0 until channels) sum += sb.get(i + ch).toInt()
                                          resampler.push(sum / (32768f * channels))
                                          i += channels
                                      }
                                  }
                              }
                              c.releaseOutputBuffer(outIdx, false)
                              if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) outputDone = true
                          } else if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              val nf = c.outputFormat
                              channels = nf.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                              floatPcm = nf.containsKey(MediaFormat.KEY_PCM_ENCODING) &&
                                  nf.getInteger(MediaFormat.KEY_PCM_ENCODING) == AudioFormat.ENCODING_PCM_FLOAT
                              val newRate = nf.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                              if (newRate != sampleRate) {
                                  resampler.flush()
                                  sampleRate = newRate
                                  resampler = MonoResampler(newRate, OUT_RATE, onSamples)
                              }
                          }
                      }
                      resampler.flush()
                      onProgress(1f)
                  } finally {
                      try { codec?.stop() } catch (ignored: Exception) {}
                      try { codec?.release() } catch (ignored: Exception) {}
                      try { extractor.release() } catch (ignored: Exception) {}
                  }
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/ModelManager.kt')"
          cat > 'app/src/main/java/com/example/legendasth/ModelManager.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.content.Context
          import java.io.File
          import java.io.FileOutputStream
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL

          /** Baixa os modelos: Whisper "small" (voz), detector de fala Silero e o dicionário de tokens. */
          object ModelManager {

              const val ENCODER = "small-encoder.int8.onnx"
              const val DECODER = "small-decoder.int8.onnx"
              const val TOKENS = "small-tokens.txt"
              const val VAD = "silero_vad.onnx"

              private const val OK = ".ok"
              private const val WHISPER_BASE =
                  "https://huggingface.co/csukuangfj/sherpa-onnx-whisper-small/resolve/main/"
              private const val VAD_URL =
                  "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"

              private class Item(val name: String, val url: String, val label: String, val minBytes: Long)

              private val items = listOf(
                  Item(VAD, VAD_URL, "detector de fala", 500_000L),
                  Item(TOKENS, WHISPER_BASE + TOKENS, "dicionário", 500_000L),
                  Item(ENCODER, WHISPER_BASE + ENCODER, "modelo de voz (parte 1)", 100_000_000L),
                  Item(DECODER, WHISPER_BASE + DECODER, "modelo de voz (parte 2)", 250_000_000L)
              )

              fun dir(context: Context): File = File(context.filesDir, "whisper-small")

              fun ready(context: Context): Boolean = File(dir(context), OK).exists()

              /** Baixa tudo que falta. Se a conexão cair, a próxima tentativa continua de onde parou. */
              fun download(context: Context, onProgress: (String, Int) -> Unit) {
                  val dir = dir(context)
                  dir.mkdirs()
                  if (dir.usableSpace < 450_000_000L) {
                      throw IOException("Pouco espaço livre no celular (precisa de cerca de 450 MB).")
                  }
                  for ((index, item) in items.withIndex()) {
                      val title = "Baixando ${item.label} (${index + 1}/${items.size})"
                      fetch(item, dir) { pct -> onProgress(title, pct) }
                  }
                  File(dir, OK).writeText("ok")
              }

              private fun fetch(item: Item, dir: File, onPercent: (Int) -> Unit) {
                  val target = File(dir, item.name)
                  if (target.exists() && target.length() >= item.minBytes) {
                      onPercent(100)
                      return
                  }
                  val part = File(dir, item.name + ".part")
                  val have = if (part.exists()) part.length() else 0L

                  val conn = URL(item.url).openConnection() as HttpURLConnection
                  conn.connectTimeout = 20_000
                  conn.readTimeout = 30_000
                  conn.instanceFollowRedirects = true
                  if (have > 0) conn.setRequestProperty("Range", "bytes=$have-")
                  conn.connect()

                  val code = conn.responseCode
                  val append: Boolean
                  val total: Long
                  when (code) {
                      HttpURLConnection.HTTP_PARTIAL -> {
                          append = true
                          total = have + conn.contentLengthLong
                      }
                      HttpURLConnection.HTTP_OK -> {
                          append = false
                          total = conn.contentLengthLong
                      }
                      416 -> {
                          if (have >= item.minBytes) {
                              part.renameTo(target)
                              onPercent(100)
                              return
                          }
                          part.delete()
                          throw IOException("Download interrompido. Toque em baixar de novo.")
                      }
                      else -> throw IOException("Falha ao baixar ${item.name} (HTTP $code)")
                  }

                  var done = if (append) have else 0L
                  var lastPct = -1
                  conn.inputStream.use { input ->
                      FileOutputStream(part, append).use { output ->
                          val buffer = ByteArray(128 * 1024)
                          while (true) {
                              val n = input.read(buffer)
                              if (n < 0) break
                              output.write(buffer, 0, n)
                              done += n
                              if (total > 0) {
                                  val pct = (done * 100 / total).toInt()
                                  if (pct != lastPct) {
                                      lastPct = pct
                                      onPercent(pct)
                                  }
                              }
                          }
                      }
                  }
                  conn.disconnect()

                  if (total > 0 && part.length() < total) {
                      throw IOException("Download incompleto de ${item.name}. Toque em baixar de novo.")
                  }
                  if (part.length() < item.minBytes) {
                      part.delete()
                      throw IOException("Arquivo ${item.name} veio incompleto. Toque em baixar de novo.")
                  }
                  target.delete()
                  if (!part.renameTo(target)) throw IOException("Não foi possível salvar ${item.name}")
                  onPercent(100)
              }
          }
