name: Compilar APK

# Este arquivo contem o projeto inteiro (Legendas TH-EN). Ao salvar no GitHub,
# ele compila o app sozinho e publica o APK na aba "Releases".
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar os arquivos do projeto
        run: |
          set -e
          mkdir -p proj
          cd proj
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'LEGENDAS_EOF_END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LegendasTH"
          include(":app")
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'LEGENDAS_EOF_END'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'LEGENDAS_EOF_END'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'LEGENDAS_EOF_END'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.legendasth"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.legendasth"
                  // Android 10 (API 29) é o mínimo para salvar o .srt em Downloads sem permissão
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              // Chave fixa: assim cada APK novo atualiza o app instalado sem apagar os modelos baixados.
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")

              // Reconhecimento de voz offline (Whisper + detector de fala), baixado pelo workflow em app/libs
              implementation(files("libs/sherpa-onnx-1.13.7.aar"))

              // Tradução offline tailandês -> inglês
              implementation("com.google.mlkit:translate:17.0.3")
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/debug.keystore.b64')"
          cat > 'app/debug.keystore.b64' <<'LEGENDAS_EOF_END'
          
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'LEGENDAS_EOF_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Só rede (baixar modelos), serviço em segundo plano e manter o processador ligado.
                   Não usa microfone, nem gravação de tela, nem sobreposição. -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.LegendasTH">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PlayerActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="false" />

                  <service
                      android:name=".JobService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>

          </manifest>
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'LEGENDAS_EOF_END'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Legendas TH-EN</string>
          </resources>
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'LEGENDAS_EOF_END'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LegendasTH" parent="Theme.MaterialComponents.DayNight.DarkActionBar" />
          </resources>
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/res/layout/activity_main.xml')"
          cat > 'app/src/main/res/layout/activity_main.xml' <<'LEGENDAS_EOF_END'
