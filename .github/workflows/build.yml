          package com.example.legendasth

          import android.content.Context
          import android.media.AudioFormat
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import java.nio.ByteOrder

          /**
           * Converte um fluxo de amostras mono para 16 kHz fazendo a média das amostras de entrada
           * que cabem em cada amostra de saída (um filtro simples que evita chiado ao reduzir a taxa).
           */
          class MonoResampler(inRate: Int, outRate: Int, private val sink: (FloatArray, Int) -> Unit) {
              private val ratio = inRate.toDouble() / outRate
              private var acc = 0.0
              private var filled = 0.0
              private val buf = FloatArray(16_000)
              private var n = 0

              fun push(x: Float) {
                  var w = 1.0
                  while (w > 1e-9) {
                      val need = ratio - filled
                      if (w < need - 1e-9) {
                          acc += x * w
                          filled += w
                          w = 0.0
                      } else {
                          acc += x * need
                          w -= need
                          buf[n++] = (acc / ratio).toFloat()
                          acc = 0.0
                          filled = 0.0
                          if (n == buf.size) flush()
                      }
                  }
              }

              fun flush() {
                  if (n > 0) {
                      sink(buf, n)
                      n = 0
                  }
              }
          }

          object AudioDecoder {
              const val OUT_RATE = 16_000

              class NoAudioException : Exception("Este vídeo não tem faixa de áudio.")

              /**
               * Decodifica o áudio do vídeo para 16 kHz mono e entrega em pedaços para [onSamples].
               * O array entregue é reaproveitado: quem receber deve copiar o que precisar guardar.
               */
              fun decode(
                  context: Context,
                  uri: Uri,
                  isCancelled: () -> Boolean,
                  onProgress: (Float) -> Unit,
                  onSamples: (FloatArray, Int) -> Unit,
                  onDuration: (Long) -> Unit = {}
              ) {
                  val extractor = MediaExtractor()
                  var codec: MediaCodec? = null
                  try {
                      extractor.setDataSource(context, uri, null)

                      var trackIndex = -1
                      var found: MediaFormat? = null
                      for (i in 0 until extractor.trackCount) {
                          val f = extractor.getTrackFormat(i)
                          val mime = f.getString(MediaFormat.KEY_MIME) ?: continue
                          if (mime.startsWith("audio/")) {
                              trackIndex = i
                              found = f
                              break
                          }
                      }
                      val format: MediaFormat = found ?: throw NoAudioException()
                      extractor.selectTrack(trackIndex)

                      val mime = format.getString(MediaFormat.KEY_MIME) ?: throw NoAudioException()
                      val durationUs =
                          if (format.containsKey(MediaFormat.KEY_DURATION)) format.getLong(MediaFormat.KEY_DURATION) else 0L

                      if (durationUs > 0) onDuration(durationUs / 1000)

                      val c = MediaCodec.createDecoderByType(mime)
                      codec = c
                      c.configure(format, null, null, 0)
                      c.start()

                      var sampleRate = format.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                      var channels = format.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                      var floatPcm = false
                      var resampler = MonoResampler(sampleRate, OUT_RATE, onSamples)

                      val info = MediaCodec.BufferInfo()
                      var inputDone = false
                      var outputDone = false

                      while (!outputDone) {
                          if (isCancelled()) break

                          if (!inputDone) {
                              val inIdx = c.dequeueInputBuffer(10_000)
                              if (inIdx >= 0) {
                                  val inBuf = c.getInputBuffer(inIdx)
                                  val size = if (inBuf != null) extractor.readSampleData(inBuf, 0) else -1
                                  if (size < 0) {
                                      c.queueInputBuffer(inIdx, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      inputDone = true
                                  } else {
                                      val t = extractor.sampleTime
                                      c.queueInputBuffer(inIdx, 0, size, t, 0)
                                      if (durationUs > 0 && t >= 0) {
                                          onProgress((t.toFloat() / durationUs).coerceIn(0f, 1f))
                                      }
                                      extractor.advance()
                                  }
                              }
                          }

                          val outIdx = c.dequeueOutputBuffer(info, 10_000)
                          if (outIdx >= 0) {
                              val out = c.getOutputBuffer(outIdx)
                              if (out != null && info.size > 0) {
                                  out.position(info.offset)
                                  out.limit(info.offset + info.size)
                                  out.order(ByteOrder.nativeOrder())
                                  if (floatPcm) {
                                      val fb = out.asFloatBuffer()
                                      val total = fb.remaining()
                                      var i = 0
                                      while (i + channels <= total) {
                                          var sum = 0f
                                          for (ch in 0 until channels) sum += fb.get(i + ch)
                                          resampler.push(sum / channels)
                                          i += channels
                                      }
                                  } else {
                                      val sb = out.asShortBuffer()
                                      val total = sb.remaining()
                                      var i = 0
                                      while (i + channels <= total) {
                                          var sum = 0
                                          for (ch in 0 until channels) sum += sb.get(i + ch).toInt()
                                          resampler.push(sum / (32768f * channels))
                                          i += channels
                                      }
                                  }
                              }
                              c.releaseOutputBuffer(outIdx, false)
                              if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) outputDone = true
                          } else if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              val nf = c.outputFormat
                              channels = nf.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                              floatPcm = nf.containsKey(MediaFormat.KEY_PCM_ENCODING) &&
                                  nf.getInteger(MediaFormat.KEY_PCM_ENCODING) == AudioFormat.ENCODING_PCM_FLOAT
                              val newRate = nf.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                              if (newRate != sampleRate) {
                                  resampler.flush()
                                  sampleRate = newRate
                                  resampler = MonoResampler(newRate, OUT_RATE, onSamples)
                              }
                          }
                      }
                      resampler.flush()
                      onProgress(1f)
                  } finally {
                      try { codec?.stop() } catch (ignored: Exception) {}
                      try { codec?.release() } catch (ignored: Exception) {}
                      try { extractor.release() } catch (ignored: Exception) {}
                  }
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/ModelManager.kt')"
          cat > 'app/src/main/java/com/example/legendasth/ModelManager.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.content.Context
          import java.io.File
          import java.io.FileOutputStream
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL

          /** Tamanhos de modelo do Whisper. "small" acerta mais; "base" é bem mais leve e rápido. */
          enum class Quality(val key: String, val encoderMin: Long, val decoderMin: Long) {
              SMALL("small", 100_000_000L, 250_000_000L),
              BASE("base", 25_000_000L, 120_000_000L)
          }

          /**
           * Baixa os modelos: Whisper (voz), detector de fala Silero, dicionário de tokens
           * e, se o usuário quiser, o redutor de ruído GTCRN.
           * Cada tamanho de Whisper fica na sua pasta: filesDir/whisper-small ou filesDir/whisper-base.
           */
          object ModelManager {

              const val VAD = "silero_vad.onnx"
              const val DENOISER = "gtcrn_simple.onnx"

              private const val OK = ".ok"
              private const val VAD_URL =
                  "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"
              private const val DENOISER_URL =
                  "https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/gtcrn_simple.onnx"
              private const val DENOISER_MIN = 20_000L

              fun dir(context: Context, q: Quality): File = File(context.filesDir, "whisper-" + q.key)
              fun encoder(context: Context, q: Quality): File = File(dir(context, q), q.key + "-encoder.int8.onnx")
              fun decoder(context: Context, q: Quality): File = File(dir(context, q), q.key + "-decoder.int8.onnx")
              fun tokens(context: Context, q: Quality): File = File(dir(context, q), q.key + "-tokens.txt")
              fun vad(context: Context, q: Quality): File = File(dir(context, q), VAD)
              fun denoiser(context: Context, q: Quality): File = File(dir(context, q), DENOISER)

              private fun denoiserOk(context: Context, q: Quality): Boolean {
                  val f = denoiser(context, q)
                  return f.exists() && f.length() >= DENOISER_MIN
              }

              fun ready(context: Context, q: Quality, denoise: Boolean): Boolean =
                  File(dir(context, q), OK).exists() && (!denoise || denoiserOk(context, q))

              private class Item(val file: File, val url: String, val label: String, val minBytes: Long)

              private fun items(context: Context, q: Quality, denoise: Boolean): List<Item> {
                  val base = "https://huggingface.co/csukuangfj/sherpa-onnx-whisper-" + q.key + "/resolve/main/"
                  val list = ArrayList<Item>()
                  list.add(Item(vad(context, q), VAD_URL, "detector de fala", 500_000L))
                  if (denoise) list.add(Item(denoiser(context, q), DENOISER_URL, "redutor de ruído", DENOISER_MIN))
                  list.add(Item(tokens(context, q), base + tokens(context, q).name, "dicionário", 500_000L))
                  list.add(Item(encoder(context, q), base + encoder(context, q).name, "modelo de voz (parte 1)", q.encoderMin))
                  list.add(Item(decoder(context, q), base + decoder(context, q).name, "modelo de voz (parte 2)", q.decoderMin))
                  return list
              }

              /** Baixa o que falta. Se a conexão cair, a próxima tentativa continua de onde parou. */
              fun download(context: Context, q: Quality, denoise: Boolean, onProgress: (String, Int) -> Unit) {
                  val dir = dir(context, q)
                  dir.mkdirs()
                  val items = items(context, q, denoise)

                  var missing = 0L
                  for (item in items) {
                      if (!(item.file.exists() && item.file.length() >= item.minBytes)) missing += item.minBytes
                  }
                  if (dir.usableSpace < missing + missing / 10) {
                      throw IOException("Pouco espaço livre no celular (precisa de cerca de ${missing / 1_000_000 + 20} MB).")
                  }

                  for ((index, item) in items.withIndex()) {
                      val title = "Baixando ${item.label} (${index + 1}/${items.size})"
                      fetch(item) { pct -> onProgress(title, pct) }
                  }
                  File(dir, OK).writeText("ok")
              }

              private fun fetch(item: Item, onPercent: (Int) -> Unit) {
                  val target = item.file
                  if (target.exists() && target.length() >= item.minBytes) {
                      onPercent(100)
                      return
                  }
                  val part = File(target.path + ".part")
                  val have = if (part.exists()) part.length() else 0L

                  val conn = URL(item.url).openConnection() as HttpURLConnection
                  conn.connectTimeout = 20_000
                  conn.readTimeout = 30_000
                  conn.instanceFollowRedirects = true
                  if (have > 0) conn.setRequestProperty("Range", "bytes=$have-")
                  conn.connect()

                  val code = conn.responseCode
                  val append: Boolean
                  val total: Long
                  when (code) {
                      HttpURLConnection.HTTP_PARTIAL -> {
                          append = true
                          total = have + conn.contentLengthLong
                      }
                      HttpURLConnection.HTTP_OK -> {
                          append = false
                          total = conn.contentLengthLong
                      }
                      416 -> {
                          if (have >= item.minBytes) {
                              target.delete()
                              part.renameTo(target)
                              onPercent(100)
                              return
                          }
                          part.delete()
                          throw IOException("Download interrompido. Toque em baixar de novo.")
                      }
                      else -> throw IOException("Falha ao baixar ${target.name} (HTTP $code)")
                  }

                  var done = if (append) have else 0L
                  var lastPct = -1
                  conn.inputStream.use { input ->
                      FileOutputStream(part, append).use { output ->
                          val buffer = ByteArray(128 * 1024)
                          while (true) {
                              val n = input.read(buffer)
                              if (n < 0) break
                              output.write(buffer, 0, n)
                              done += n
                              if (total > 0) {
                                  val pct = (done * 100 / total).toInt()
                                  if (pct != lastPct) {
                                      lastPct = pct
                                      onPercent(pct)
                                  }
                              }
                          }
                      }
                  }
                  conn.disconnect()

                  if (total > 0 && part.length() < total) {
                      throw IOException("Download incompleto de ${target.name}. Toque em baixar de novo.")
                  }
                  if (part.length() < item.minBytes) {
                      part.delete()
                      throw IOException("Arquivo ${target.name} veio incompleto. Toque em baixar de novo.")
                  }
                  target.delete()
                  if (!part.renameTo(target)) throw IOException("Não foi possível salvar ${target.name}")
                  onPercent(100)
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/SubtitleEngine.kt')"
          cat > 'app/src/main/java/com/example/legendasth/SubtitleEngine.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.content.Context
          import android.net.Uri
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.Translator
          import com.google.mlkit.nl.translate.TranslatorOptions
          import com.k2fsa.sherpa.onnx.OfflineModelConfig
          import com.k2fsa.sherpa.onnx.OfflineRecognizer
          import com.k2fsa.sherpa.onnx.OfflineRecognizerConfig
          import com.k2fsa.sherpa.onnx.OfflineSpeechDenoiser
          import com.k2fsa.sherpa.onnx.OfflineSpeechDenoiserConfig
          import com.k2fsa.sherpa.onnx.OfflineSpeechDenoiserGtcrnModelConfig
          import com.k2fsa.sherpa.onnx.OfflineSpeechDenoiserModelConfig
          import com.k2fsa.sherpa.onnx.OfflineWhisperModelConfig
          import com.k2fsa.sherpa.onnx.SileroVadModelConfig
          import com.k2fsa.sherpa.onnx.Vad
          import com.k2fsa.sherpa.onnx.VadModelConfig

          /**
           * Fluxo completo: áudio -> (redução de ruído opcional) -> detector de fala (separa os trechos com voz)
           * -> (agrupamento opcional de falas curtas) -> Whisper em tailandês -> tradução para inglês
           * -> lista de legendas com tempos.
           */
          class SubtitleEngine(
              private val context: Context,
              private val quality: Quality,
              private val denoise: Boolean,
              private val pack: Boolean
          ) {

              private class Piece(val start: Int, val samples: FloatArray)

              private var recognizer: OfflineRecognizer? = null
              private var vad: Vad? = null
              private var denoiser: OfflineSpeechDenoiser? = null
              private var translator: Translator? = null

              /** Carrega os modelos (demora alguns segundos). Chamar fora da thread principal. */
              fun open() {
                  val threads = Runtime.getRuntime().availableProcessors().coerceIn(2, 4)

                  val whisper = OfflineWhisperModelConfig()
                  whisper.encoder = ModelManager.encoder(context, quality).absolutePath
                  whisper.decoder = ModelManager.decoder(context, quality).absolutePath
                  whisper.language = "th"
                  whisper.task = "transcribe"

                  val modelConfig = OfflineModelConfig()
                  modelConfig.whisper = whisper
                  modelConfig.tokens = ModelManager.tokens(context, quality).absolutePath
                  modelConfig.numThreads = threads
                  modelConfig.provider = "cpu"
                  modelConfig.debug = false

                  val config = OfflineRecognizerConfig()
                  config.modelConfig = modelConfig
                  config.decodingMethod = "greedy_search"
                  recognizer = OfflineRecognizer(config = config)

                  val silero = SileroVadModelConfig()
                  silero.model = ModelManager.vad(context, quality).absolutePath
                  silero.threshold = 0.5f
                  silero.minSilenceDuration = 0.4f
                  silero.minSpeechDuration = 0.25f
                  silero.windowSize = 512
                  silero.maxSpeechDuration = 25f // o Whisper lê no máximo 30 s por vez

                  val vadConfig = VadModelConfig()
                  vadConfig.sileroVadModelConfig = silero
                  vadConfig.sampleRate = AudioDecoder.OUT_RATE
                  vadConfig.numThreads = 1
                  vadConfig.provider = "cpu"
                  vad = Vad(config = vadConfig)

                  if (denoise) {
                      val gtcrn = OfflineSpeechDenoiserGtcrnModelConfig()
                      gtcrn.model = ModelManager.denoiser(context, quality).absolutePath
                      val dm = OfflineSpeechDenoiserModelConfig()
                      dm.gtcrn = gtcrn
                      dm.numThreads = 1
                      dm.provider = "cpu"
                      val dc = OfflineSpeechDenoiserConfig()
                      dc.model = dm
                      val d = OfflineSpeechDenoiser(null, dc)
                      if (d.sampleRate != AudioDecoder.OUT_RATE) {
                          d.release()
                          throw IllegalStateException("O redutor de ruído usa ${d.sampleRate} Hz; era esperado 16000 Hz.")
                      }
                      denoiser = d
                  }

                  val tr = Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.THAI)
                          .setTargetLanguage(TranslateLanguage.ENGLISH)
                          .build()
                  )
                  Tasks.await(tr.downloadModelIfNeeded(DownloadConditions.Builder().build()))
                  translator = tr
              }

              /**
               * Analisa o arquivo inteiro (vídeo ou áudio). [onCue] é chamado a cada legenda pronta,
               * na ordem. Chamar fora da thread principal.
               */
              fun run(
                  uri: Uri,
                  isCancelled: () -> Boolean,
                  onProgress: (Int) -> Unit,
                  onDuration: (Long) -> Unit,
                  onCue: (Cue) -> Unit
              ): List<Cue> {
                  val rec = recognizer ?: throw IllegalStateException("Modelo não carregado")
                  val detector = vad ?: throw IllegalStateException("Modelo não carregado")
                  val rate = AudioDecoder.OUT_RATE
                  val cues = ArrayList<Cue>()
                  val window = ArrayList<Piece>()
                  var windowSamples = 0

                  fun msOf(sample: Int): Long = sample * 1000L / rate

                  fun emit(cue: Cue) {
                      cues.add(cue)
                      onCue(cue)
                  }

                  fun transcribe(pieces: List<Piece>) {
                      var total = 0
                      for ((i, p) in pieces.withIndex()) total += p.samples.size + (if (i > 0) Packing.PAD else 0)
                      val audio = FloatArray(total)
                      var off = 0
                      for ((i, p) in pieces.withIndex()) {
                          if (i > 0) off += Packing.PAD
                          System.arraycopy(p.samples, 0, audio, off, p.samples.size)
                          off += p.samples.size
                      }

                      val th = decodeSegment(rec, audio)
                      if (Subtitles.looksLikeHallucination(th)) return
                      val en = translate(th)

                      if (pieces.size == 1) {
                          val p = pieces[0]
                          emit(Cue(msOf(p.start), msOf(p.start + p.samples.size), th, en))
                          return
                      }
                      // Várias falas numa janela só: o texto é repartido entre elas pela duração de cada uma.
                      val weights = pieces.map { it.samples.size.toDouble() }
                      val thParts = TextSplit.proportional(th, weights)
                      val enParts = TextSplit.proportional(en, weights)
                      for ((i, p) in pieces.withIndex()) {
                          if (thParts[i].isEmpty() && enParts[i].isEmpty()) continue
                          emit(Cue(msOf(p.start), msOf(p.start + p.samples.size), thParts[i], enParts[i]))
                      }
                  }

                  fun flushWindow() {
                      if (window.isEmpty()) return
                      val group = ArrayList(window)
                      window.clear()
                      windowSamples = 0
                      transcribe(group)
                  }

                  fun addPiece(p: Piece) {
                      if (!pack) {
                          transcribe(listOf(p))
                          return
                      }
                      if (window.isNotEmpty()) {
                          val last = window[window.size - 1]
                          if (!Packing.canJoin(last.start + last.samples.size, windowSamples, p.start, p.samples.size)) {
                              flushWindow()
                          }
                      }
                      windowSamples += (if (window.isEmpty()) 0 else Packing.PAD) + p.samples.size
                      window.add(p)
                  }

                  fun drain() {
                      while (!detector.empty()) {
                          val seg = detector.front()
                          detector.pop()
                          addPiece(Piece(seg.start, seg.samples))
                      }
                  }

                  val feed: (FloatArray, Int) -> Unit = { buf, n ->
                      detector.acceptWaveform(buf.copyOf(n))
                      drain()
                  }

                  val den = denoiser
                  val blocks: BlockDenoiser? =
                      if (den != null) BlockDenoiser({ input -> den.run(input, rate).samples }, feed) else null

                  var lastPct = -1
                  AudioDecoder.decode(
                      context,
                      uri,
                      isCancelled,
                      onProgress = { f ->
                          val pct = (f * 100).toInt()
                          if (pct != lastPct) {
                              lastPct = pct
                              onProgress(pct)
                          }
                      },
                      onSamples = { buf, n ->
                          if (blocks != null) blocks.push(buf, n) else feed(buf, n)
                      },
                      onDuration = onDuration
                  )
                  if (!isCancelled()) {
                      blocks?.finish()
                      detector.flush()
                      drain()
                      flushWindow()
                  }
                  return cues
              }

              private fun decodeSegment(rec: OfflineRecognizer, samples: FloatArray): String {
                  val stream = rec.createStream()
                  try {
                      stream.acceptWaveform(samples, AudioDecoder.OUT_RATE)
                      rec.decode(stream)
                      return rec.getResult(stream).text.trim()
                  } finally {
                      stream.release()
                  }
              }

              private fun translate(text: String): String {
                  val tr = translator ?: return ""
                  return try {
                      Tasks.await(tr.translate(text)).trim()
                  } catch (e: Exception) {
                      ""
                  }
              }

              fun close() {
                  try { recognizer?.release() } catch (ignored: Throwable) {}
                  try { vad?.release() } catch (ignored: Throwable) {}
                  try { denoiser?.release() } catch (ignored: Throwable) {}
                  try { translator?.close() } catch (ignored: Throwable) {}
                  recognizer = null
                  vad = null
                  denoiser = null
                  translator = null
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/JobService.kt')"
          cat > 'app/src/main/java/com/example/legendasth/JobService.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import java.util.Locale

          /** Estado do trabalho em andamento, lido pela tela principal. */
          object JobState {
              @Volatile var busy = false
              @Volatile var status = ""
              @Volatile var percent = -1
              @Volatile var log: List<String> = emptyList()
              @Volatile var onChange: (() -> Unit)? = null

              private val main = Handler(Looper.getMainLooper())

              fun changed() {
                  main.post { onChange?.invoke() }
              }
          }

          /**
           * Faz o trabalho pesado (baixar modelos ou analisar um vídeo) em primeiro plano,
           * para o Android não encerrar o app quando você sair da tela ou apagar a tela.
           */
          class JobService : Service() {

              companion object {
                  const val ACTION_DOWNLOAD = "com.example.legendasth.DOWNLOAD"
                  const val ACTION_ANALYZE = "com.example.legendasth.ANALYZE"
                  const val ACTION_CANCEL = "com.example.legendasth.CANCEL"
                  private const val CHANNEL = "job"
                  private const val NOTIF_ID = 1
              }

              @Volatile private var cancelled = false
              private var wakeLock: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action
                  if (action == ACTION_CANCEL) {
                      cancelled = true
                      if (!JobState.busy) stopSelf()
                      return START_NOT_STICKY
                  }

                  enterForeground("Preparando…")
                  if (JobState.busy) return START_NOT_STICKY

                  when (action) {
                      ACTION_DOWNLOAD -> launch { downloadModels() }
                      ACTION_ANALYZE -> {
                          val uri = intent?.data
                          if (uri == null) {
                              stopForeground(STOP_FOREGROUND_REMOVE)
                              stopSelf()
                          } else {
                              launch { analyze(uri) }
                          }
                      }
                      else -> {
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun launch(block: () -> Unit) {
                  JobState.busy = true
                  cancelled = false
                  acquireWakeLock()
                  Thread {
                      try {
                          block()
                      } catch (t: Throwable) {
                          JobState.status = "Erro: " + (t.message ?: t.javaClass.simpleName)
                          JobState.percent = -1
                      } finally {
                          releaseWakeLock()
                          JobState.busy = false
                          JobState.changed()
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                      }
                  }.start()
              }

              private fun acquireWakeLock() {
                  val pm = getSystemService(PowerManager::class.java)
                  val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "legendasth:job")
                  wl.acquire(4 * 60 * 60 * 1000L)
                  wakeLock = wl
              }

              private fun releaseWakeLock() {
                  try {
                      val wl = wakeLock
                      if (wl != null && wl.isHeld) wl.release()
                  } catch (ignored: Exception) {
                  }
                  wakeLock = null
              }

              // ---------------------------------------------------------------- trabalhos

              private fun post(status: String, percent: Int) {
                  JobState.status = status
                  JobState.percent = percent
                  JobState.changed()
                  getSystemService(NotificationManager::class.java).notify(NOTIF_ID, buildNotification(status, percent))
              }

              private fun downloadModels() {
                  val quality = Prefs.quality(this)
                  val denoise = Prefs.denoise(this)
                  post("Baixando modelos…", 0)
                  ModelManager.download(this, quality, denoise) { label, pct -> post("$label: $pct%", pct) }
                  post("Modelos prontos. Agora escolha um vídeo ou áudio.", -1)
              }

              private fun analyze(uri: Uri) {
                  val name = displayName(uri)
                  val base = name.substringBeforeLast('.', name).replace(Regex("[\\\\/:*?\"<>|]"), "_")
                  JobState.log = emptyList()
                  CueStore.begin(this, uri.toString(), name)

                  post("Carregando os modelos…", -1)
                  val engine = SubtitleEngine(
                      applicationContext, Prefs.quality(this), Prefs.denoise(this), Prefs.pack(this)
                  )
                  val startedAt = SystemClock.elapsedRealtime()
                  var count = 0
                  var durationMs = 0L
                  val recent = ArrayList<String>()
                  try {
                      engine.open()
                      post("Analisando o áudio…", 0)

                      val cues = engine.run(
                          uri,
                          isCancelled = { cancelled },
                          onProgress = { pct ->
                              val elapsed = (SystemClock.elapsedRealtime() - startedAt) / 1000
                              val eta = if (pct >= 2) " · faltam cerca de ${(elapsed * (100 - pct) / pct / 60) + 1} min" else ""
                              var pace = ""
                              if (durationMs > 0 && pct >= 1 && elapsed >= 5) {
                                  val speed = (durationMs / 1000.0 * pct / 100.0) / elapsed
                                  pace = " · ritmo " + String.format(Locale.US, "%.2f", speed) + "× o tempo real"
                              }
                              post("Analisando o áudio… $pct% · $count trechos$pace$eta", pct)
                          },
                          onDuration = { ms -> durationMs = ms },
                          onCue = { cue ->
                              count++
                              CueStore.append(this, cue)
                              recent.add("[${Subtitles.clock(cue.startMs)}] ${cue.th}\n  → ${cue.en}")
                              while (recent.size > 6) recent.removeAt(0)
                              JobState.log = ArrayList(recent)
                              JobState.changed()
                          }
                      )

                      if (cancelled) {
                          post("Cancelado. ${cues.size} legendas parciais ficaram salvas.", -1)
                          return
                      }
                      if (cues.isEmpty()) {
                          post("Não encontrei fala em tailandês neste arquivo.", -1)
                          return
                      }

                      val where = saveSrtFiles(base, cues)
                      post("Pronto! ${cues.size} legendas. $where", -1)
                  } finally {
                      engine.close()
                  }
              }

              private fun saveSrtFiles(base: String, cues: List<Cue>): String {
                  val en = Subtitles.toSrt(Subtitles.expand(cues)) { it.en }
                  val th = Subtitles.toSrt(cues) { it.th }
                  val ok1 = saveText("$base.en.srt", en)
                  val ok2 = saveText("$base.th.srt", th)
                  return if (ok1 && ok2) "Arquivos .srt salvos em Downloads/LegendasTH." else "Não consegui salvar os .srt."
              }

              private fun saveText(fileName: String, content: String): Boolean {
                  return try {
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                          put(MediaStore.MediaColumns.MIME_TYPE, "application/x-subrip")
                          put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/LegendasTH")
                      }
                      val target = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values) ?: return false
                      val out = contentResolver.openOutputStream(target) ?: return false
                      out.use { it.write(content.toByteArray(Charsets.UTF_8)) }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun displayName(uri: Uri): String {
                  try {
                      contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val n = c.getString(0)
                              if (!n.isNullOrEmpty()) return n
                          }
                      }
                  } catch (ignored: Exception) {
                  }
                  return "video"
              }

              // ------------------------------------------------------------- notificação

              private fun buildNotification(text: String, percent: Int): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val builder = NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setContentTitle(getString(R.string.app_name))
                      .setContentText(text)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(open)
                  if (percent in 0..100) builder.setProgress(100, percent, false) else builder.setProgress(0, 0, true)
                  return builder.build()
              }

              private fun enterForeground(text: String) {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Legendas", NotificationManager.IMPORTANCE_LOW)
                  )
                  ServiceCompat.startForeground(
                      this, NOTIF_ID, buildNotification(text, -1), ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                  )
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/legendasth/MainActivity.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.ProgressBar
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var tvStatus: TextView
              private lateinit var tvLog: TextView
              private lateinit var progress: ProgressBar
              private lateinit var btnModels: Button
              private lateinit var btnPick: Button
              private lateinit var btnCancel: Button
              private lateinit var btnOpen: Button
              private lateinit var rgQuality: RadioGroup
              private lateinit var rbSmall: RadioButton
              private lateinit var rbBase: RadioButton
              private lateinit var cbPack: CheckBox
              private lateinit var cbDenoise: CheckBox

              // Evita tratar como "clique do usuário" o ajuste inicial das opções.
              private var binding = false

              private val pickMedia =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                      if (uri != null) startAnalysis(uri)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvStatus = findViewById(R.id.tvStatus)
                  tvLog = findViewById(R.id.tvLog)
                  progress = findViewById(R.id.progress)
                  btnModels = findViewById(R.id.btnModels)
                  btnPick = findViewById(R.id.btnPick)
                  btnCancel = findViewById(R.id.btnCancel)
                  btnOpen = findViewById(R.id.btnOpen)
                  rgQuality = findViewById(R.id.rgQuality)
                  rbSmall = findViewById(R.id.rbSmall)
                  rbBase = findViewById(R.id.rbBase)
                  cbPack = findViewById(R.id.cbPack)
                  cbDenoise = findViewById(R.id.cbDenoise)

                  binding = true
                  if (Prefs.quality(this) == Quality.BASE) rgQuality.check(R.id.rbBase) else rgQuality.check(R.id.rbSmall)
                  cbPack.isChecked = Prefs.pack(this)
                  cbDenoise.isChecked = Prefs.denoise(this)
                  binding = false

                  rgQuality.setOnCheckedChangeListener { _, id ->
                      if (!binding) {
                          Prefs.setQuality(this, if (id == R.id.rbBase) Quality.BASE else Quality.SMALL)
                          render()
                      }
                  }
                  cbPack.setOnCheckedChangeListener { _, checked ->
                      if (!binding) Prefs.setPack(this, checked)
                  }
                  cbDenoise.setOnCheckedChangeListener { _, checked ->
                      if (!binding) {
                          Prefs.setDenoise(this, checked)
                          render()
                      }
                  }

                  btnModels.setOnClickListener {
                      ContextCompat.startForegroundService(
                          this, Intent(this, JobService::class.java).setAction(JobService.ACTION_DOWNLOAD)
                      )
                  }
                  btnPick.setOnClickListener { pickMedia.launch(arrayOf("video/*", "audio/*")) }
                  btnCancel.setOnClickListener {
                      startService(Intent(this, JobService::class.java).setAction(JobService.ACTION_CANCEL))
                  }
                  btnOpen.setOnClickListener {
                      startActivity(Intent(this, PlayerActivity::class.java))
                  }
              }

              override fun onStart() {
                  super.onStart()
                  JobState.onChange = { render() }
                  render()
              }

              override fun onStop() {
                  JobState.onChange = null
                  super.onStop()
              }

              private fun startAnalysis(uri: Uri) {
                  if (!ModelManager.ready(this, Prefs.quality(this), Prefs.denoise(this))) {
                      Toast.makeText(this, "Baixe os modelos escolhidos primeiro.", Toast.LENGTH_LONG).show()
                      return
                  }
                  try {
                      contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  } catch (ignored: Exception) {
                  }
                  val intent = Intent(this, JobService::class.java)
                  intent.action = JobService.ACTION_ANALYZE
                  intent.data = uri
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  ContextCompat.startForegroundService(this, intent)
              }

              private fun render() {
                  val busy = JobState.busy
                  val ready = ModelManager.ready(this, Prefs.quality(this), Prefs.denoise(this))

                  val status = JobState.status
                  tvStatus.text = when {
                      status.isNotEmpty() -> status
                      ready -> "Modelos prontos. Escolha um vídeo ou áudio."
                      else -> "Primeiro baixe os modelos escolhidos (uma vez só, usa internet)."
                  }

                  val p = JobState.percent
                  progress.visibility = if (busy) View.VISIBLE else View.GONE
                  progress.isIndeterminate = p < 0
                  if (p >= 0) progress.progress = p

                  tvLog.text = JobState.log.joinToString("\n")

                  rbSmall.isEnabled = !busy
                  rbBase.isEnabled = !busy
                  cbPack.isEnabled = !busy
                  cbDenoise.isEnabled = !busy

                  btnModels.isEnabled = !busy && !ready
                  btnPick.isEnabled = !busy && ready
                  btnCancel.isEnabled = busy
                  btnOpen.isEnabled = !busy && CueStore.exists(this)
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/PlayerActivity.kt')"
          cat > 'app/src/main/java/com/example/legendasth/PlayerActivity.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.WindowManager
          import android.widget.CheckBox
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import androidx.appcompat.app.AppCompatActivity

          /** Toca o vídeo e mostra por cima as legendas em inglês (e, se quiser, o tailandês). */
          class PlayerActivity : AppCompatActivity() {

              private lateinit var video: VideoView
              private lateinit var tvEn: TextView
              private lateinit var tvTh: TextView
              private lateinit var cbThai: CheckBox

              private var cues: List<Cue> = emptyList()
              private val handler = Handler(Looper.getMainLooper())

              private val tick = object : Runnable {
                  override fun run() {
                      updateSubtitle()
                      handler.postDelayed(this, 150)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_player)
                  supportActionBar?.hide()
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  video = findViewById(R.id.video)
                  tvEn = findViewById(R.id.tvEn)
                  tvTh = findViewById(R.id.tvTh)
                  cbThai = findViewById(R.id.cbThai)

                  val saved = CueStore.load(this)
                  if (saved == null || saved.cues.isEmpty()) {
                      Toast.makeText(this, "Ainda não há legendas geradas.", Toast.LENGTH_LONG).show()
                      finish()
                      return
                  }
                  cues = Subtitles.expand(saved.cues)

                  val controller = MediaController(this)
                  controller.setAnchorView(video)
                  video.setMediaController(controller)
                  video.setOnPreparedListener { video.start() }
                  video.setOnErrorListener { _, _, _ ->
                      Toast.makeText(
                          this,
                          "Não consegui tocar este vídeo aqui. Use os arquivos .srt em Downloads/LegendasTH com outro player.",
                          Toast.LENGTH_LONG
                      ).show()
                      true
                  }
                  video.setVideoURI(Uri.parse(saved.videoUri))
              }

              override fun onResume() {
                  super.onResume()
                  handler.post(tick)
              }

              override fun onPause() {
                  handler.removeCallbacks(tick)
                  if (::video.isInitialized) video.pause()
                  super.onPause()
              }

              private fun updateSubtitle() {
                  val cue = cueAt(video.currentPosition.toLong())
                  if (cue == null) {
                      tvEn.visibility = View.GONE
                      tvTh.visibility = View.GONE
                      return
                  }
                  if (cue.en.isEmpty()) {
                      tvEn.visibility = View.GONE
                  } else {
                      tvEn.text = cue.en
                      tvEn.visibility = View.VISIBLE
                  }
                  if (cbThai.isChecked && cue.th.isNotEmpty()) {
                      tvTh.text = cue.th
                      tvTh.visibility = View.VISIBLE
                  } else {
                      tvTh.visibility = View.GONE
                  }
              }

              /** As legendas estão em ordem e sem sobreposição, então basta uma busca binária. */
              private fun cueAt(ms: Long): Cue? {
                  var lo = 0
                  var hi = cues.size - 1
                  while (lo <= hi) {
                      val mid = (lo + hi) ushr 1
                      val c = cues[mid]
                      if (ms < c.startMs) {
                          hi = mid - 1
                      } else if (ms >= c.endMs) {
                          lo = mid + 1
                      } else {
                          return c
                      }
                  }
                  return null
              }
          }
          LEGENDAS_EOF_END

      - name: Preparar certificado fixo e biblioteca de voz
        working-directory: proj
        run: |
          base64 -d app/debug.keystore.b64 > app/debug.keystore
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-1.13.7.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          ls -la app/libs app/debug.keystore

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar o APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "build-${{ github.run_number }}"
          proj/app/build/outputs/apk/debug/app-debug.apk
          --title "Legendas TH-EN (build ${{ github.run_number }})"
          --notes "Baixe o arquivo app-debug.apk e instale no celular."
