                  android:textColor="#FFFFFF" />
          </FrameLayout>
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/Cue.kt')"
          cat > 'app/src/main/java/com/example/legendasth/Cue.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.content.Context
          import java.io.File
          import java.util.Locale

          /** Uma legenda: tempos em milissegundos, texto original (tailandês) e tradução (inglês). */
          data class Cue(val startMs: Long, val endMs: Long, val th: String, val en: String)

          object Subtitles {
              private const val LINE_CHARS = 42

              fun clock(ms: Long): String {
                  val total = ms / 1000
                  return String.format(Locale.US, "%02d:%02d", total / 60, total % 60)
              }

              /** O Whisper às vezes inventa texto repetido em trechos sem fala clara. Descarta esses casos. */
              fun looksLikeHallucination(text: String): Boolean {
                  val t = text.filter { !it.isWhitespace() }
                  if (t.isEmpty()) return true
                  if (t.none { it.isLetterOrDigit() }) return true
                  if (t.length >= 8 && t.toSet().size <= 2) return true
                  return isRepeated(t)
              }

              private fun isRepeated(s: String): Boolean {
                  if (s.length < 10) return false
                  for (unit in 1..15) {
                      if (unit * 4 > s.length) break
                      val u = s.substring(0, unit)
                      var count = 0
                      var i = 0
                      while (i + unit <= s.length && s.startsWith(u, i)) {
                          count++
                          i += unit
                      }
                      if (count >= 4 && count * unit >= s.length * 0.8) return true
                  }
                  return false
              }

              /** Quebra o texto em legendas de até 2 linhas de 42 caracteres. */
              fun splitEnglish(text: String): List<String> {
                  val words = text.trim().split(Regex("\\s+")).filter { it.isNotEmpty() }
                  if (words.isEmpty()) return listOf("")
                  val lines = ArrayList<String>()
                  var cur = StringBuilder()
                  for (w in words) {
                      if (cur.isNotEmpty() && cur.length + 1 + w.length > LINE_CHARS) {
                          lines.add(cur.toString())
                          cur = StringBuilder()
                      }
                      if (cur.isNotEmpty()) cur.append(' ')
                      cur.append(w)
                  }
                  if (cur.isNotEmpty()) lines.add(cur.toString())
                  val result = ArrayList<String>()
                  var i = 0
                  while (i < lines.size) {
                      result.add(if (i + 1 < lines.size) lines[i] + "\n" + lines[i + 1] else lines[i])
                      i += 2
                  }
                  return result
              }

              /** Divide legendas longas em várias, repartindo o tempo pelo tamanho do texto. */
              fun expand(cues: List<Cue>): List<Cue> {
                  val out = ArrayList<Cue>()
                  for (c in cues) {
                      val parts = splitEnglish(c.en)
                      if (parts.size <= 1) {
                          out.add(c)
                          continue
                      }
                      val total = parts.sumOf { it.length }.coerceAtLeast(1)
                      val dur = (c.endMs - c.startMs).coerceAtLeast(1L)
                      var acc = 0
                      var cursor = c.startMs
                      for ((i, p) in parts.withIndex()) {
                          acc += p.length
                          val end = if (i == parts.lastIndex) c.endMs else c.startMs + dur * acc / total
                          out.add(Cue(cursor, end, c.th, p))
                          cursor = end
                      }
                  }
                  return out
              }

              private fun stamp(ms: Long): String {
                  val h = ms / 3_600_000
                  val m = ms / 60_000 % 60
                  val s = ms / 1000 % 60
                  val milli = ms % 1000
                  return String.format(Locale.US, "%02d:%02d:%02d,%03d", h, m, s, milli)
              }

              fun toSrt(cues: List<Cue>, pick: (Cue) -> String): String {
                  val sb = StringBuilder()
                  var n = 1
                  for (c in cues) {
                      val text = pick(c).trim()
                      if (text.isEmpty()) continue
                      sb.append(n++).append('\n')
                      sb.append(stamp(c.startMs)).append(" --> ").append(stamp(maxOf(c.endMs, c.startMs + 500))).append('\n')
                      sb.append(text).append("\n\n")
                  }
                  return sb.toString()
              }
          }

          /** Guarda as legendas da última análise (uma por linha, enquanto são geradas). */
          object CueStore {
              private const val FILE = "last_cues.tsv"

              class Saved(val videoUri: String, val videoName: String, val cues: List<Cue>)

              private fun clean(s: String) = s.replace('\t', ' ').replace('\n', ' ').replace('\r', ' ')

              fun begin(context: Context, videoUri: String, videoName: String) {
                  File(context.filesDir, FILE).writeText("#" + clean(videoUri) + "\t" + clean(videoName) + "\n")
              }

              fun append(context: Context, cue: Cue) {
                  File(context.filesDir, FILE).appendText(
                      "${cue.startMs}\t${cue.endMs}\t${clean(cue.th)}\t${clean(cue.en)}\n"
                  )
              }

              fun exists(context: Context): Boolean {
                  val f = File(context.filesDir, FILE)
                  return f.exists() && f.length() > 0
              }

              fun load(context: Context): Saved? {
                  val f = File(context.filesDir, FILE)
                  if (!f.exists()) return null
                  val lines = f.readLines()
                  if (lines.isEmpty() || !lines[0].startsWith("#")) return null
                  val head = lines[0].substring(1).split('\t')
                  if (head.isEmpty()) return null
                  val cues = ArrayList<Cue>()
                  for (i in 1 until lines.size) {
                      val p = lines[i].split('\t', limit = 4)
                      if (p.size < 4) continue
                      val a = p[0].toLongOrNull() ?: continue
                      val b = p[1].toLongOrNull() ?: continue
                      cues.add(Cue(a, b, p[2], p[3]))
                  }
                  return Saved(head[0], if (head.size > 1) head[1] else "vídeo", cues)
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/Packing.kt')"
          cat > 'app/src/main/java/com/example/legendasth/Packing.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          /**
           * O Whisper sempre analisa uma janela de 30 s, mesmo que a fala tenha só 2 s.
           * Agrupar falas curtas vizinhas numa janela só reduz muito o número de análises
           * (e dá mais contexto ao modelo). Estas regras decidem quando uma fala entra no grupo.
           */
          object Packing {
              const val RATE = 16_000
              const val PAD = 4_800                 // 0,3 s de silêncio colocado entre falas agrupadas
              const val MAX_WINDOW = 24 * RATE      // o Whisper lê no máximo 30 s por vez
              const val MAX_GAP = 4 * RATE          // pausa maior que 4 s encerra o grupo

              /** [windowSamples] já inclui os silêncios de ligação do grupo atual. */
              fun canJoin(prevEnd: Int, windowSamples: Int, nextStart: Int, nextLen: Int): Boolean {
                  if (nextStart - prevEnd > MAX_GAP) return false
                  return windowSamples + PAD + nextLen <= MAX_WINDOW
              }
          }

          object TextSplit {
              /**
               * Reparte [text] em partes proporcionais aos [weights], cortando no espaço mais próximo
               * quando houver. Usado para distribuir o texto de uma janela agrupada entre as falas dela.
               */
              fun proportional(text: String, weights: List<Double>): List<String> {
                  val n = weights.size
                  val t = text.trim()
                  if (n <= 1) return listOf(t)
                  if (t.isEmpty()) return List(n) { "" }
                  val total = weights.sum()
                  if (total <= 0.0) return List(n) { i -> if (i == 0) t else "" }

                  val cuts = IntArray(n - 1)
                  var cum = 0.0
                  var prev = 0
                  for (i in 0 until n - 1) {
                      cum += weights[i]
                      var pos = Math.round(t.length * cum / total).toInt().coerceIn(prev, t.length)
                      pos = snap(t, pos, prev)
                      cuts[i] = pos
                      prev = pos
                  }
                  val out = ArrayList<String>()
                  var start = 0
                  for (i in 0 until n - 1) {
                      out.add(t.substring(start, cuts[i]).trim())
                      start = cuts[i]
                  }
                  out.add(t.substring(start).trim())
                  return out
              }

              private fun snap(t: String, pos: Int, min: Int): Int {
                  if (pos <= min || pos >= t.length) return pos
                  val range = maxOf(6, t.length / 8)
                  for (d in 0..range) {
                      val left = pos - d
                      if (left > min && left < t.length && t[left].isWhitespace()) return left
                      val right = pos + d
                      if (right > min && right < t.length && t[right].isWhitespace()) return right
                  }
                  return pos
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/BlockDenoiser.kt')"
          cat > 'app/src/main/java/com/example/legendasth/BlockDenoiser.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          /**
           * Aplica um redutor de ruído em blocos de 20 s, para não carregar o áudio inteiro na memória.
           * Cada bloco recebe 1 s do áudio anterior como "aquecimento" (descartado na saída),
           * o que evita falhas na emenda entre blocos.
           *
           * [process] recebe um trecho e devolve o trecho com ruído reduzido (taxa 16 kHz).
           * [sink] recebe o áudio já processado, na ordem.
           */
          class BlockDenoiser(
              private val process: (FloatArray) -> FloatArray,
              private val sink: (FloatArray, Int) -> Unit
          ) {
              private val blockLen = 20 * AudioDecoder.OUT_RATE
              private val ctxLen = AudioDecoder.OUT_RATE
              private val pending = FloatArray(blockLen)
              private var n = 0
              private var tail = FloatArray(0)

              fun push(samples: FloatArray, count: Int) {
                  var off = 0
                  while (off < count) {
                      val take = minOf(count - off, blockLen - n)
                      System.arraycopy(samples, off, pending, n, take)
                      n += take
                      off += take
                      if (n == blockLen) run()
                  }
              }

              fun finish() {
                  if (n > 0) run()
              }

              private fun run() {
                  val newLen = n
                  val input = FloatArray(tail.size + newLen)
                  System.arraycopy(tail, 0, input, 0, tail.size)
                  System.arraycopy(pending, 0, input, tail.size, newLen)

                  val out = process(input)

                  // Pega o final do resultado (a parte nova). Se o modelo devolver um pouco mais ou menos
                  // amostras que o esperado, o alinhamento pelo final mantém o erro abaixo de alguns ms.
                  val result = FloatArray(newLen)
                  if (out.size >= newLen) {
                      System.arraycopy(out, out.size - newLen, result, 0, newLen)
                  } else {
                      System.arraycopy(out, 0, result, newLen - out.size, out.size)
                  }
                  sink(result, newLen)

                  tail = pending.copyOfRange(maxOf(0, newLen - ctxLen), newLen)
                  n = 0
              }
          }
          LEGENDAS_EOF_END
          mkdir -p "$(dirname 'app/src/main/java/com/example/legendasth/Prefs.kt')"
          cat > 'app/src/main/java/com/example/legendasth/Prefs.kt' <<'LEGENDAS_EOF_END'
          package com.example.legendasth

          import android.content.Context

          /** Escolhas do usuário na tela principal, guardadas no aparelho. */
          object Prefs {
              private const val FILE = "opcoes"

              private fun p(context: Context) = context.getSharedPreferences(FILE, Context.MODE_PRIVATE)

              fun quality(context: Context): Quality =
                  if (p(context).getString("modelo", "small") == "base") Quality.BASE else Quality.SMALL

              fun setQuality(context: Context, q: Quality) {
                  p(context).edit().putString("modelo", q.key).apply()
              }

              /** Agrupar falas curtas (mais rápido). Ligado por padrão. */
              fun pack(context: Context): Boolean = p(context).getBoolean("agrupar", true)

              fun setPack(context: Context, value: Boolean) {
                  p(context).edit().putBoolean("agrupar", value).apply()
              }

              /** Reduzir ruído antes de reconhecer. Desligado por padrão. */
              fun denoise(context: Context): Boolean = p(context).getBoolean("ruido", false)

              fun setDenoise(context: Context, value: Boolean) {
                  p(context).edit().putBoolean("ruido", value).apply()
              }
          }
