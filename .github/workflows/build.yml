                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Legendas tailandês → inglês"
                      android:textSize="22sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Escolha um vídeo ou áudio baixado no celular. O app reconhece o tailandês do arquivo, traduz para inglês e mostra com as legendas. Também salva arquivos .srt na pasta Downloads/LegendasTH.\n\nNão usa microfone nem grava a tela. Tudo roda no aparelho."
